<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error - Tours & Travels</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #dc3545 0%, #a82a2a 100%);
        }

        .error-content {
            text-align: center;
            color: white;
            max-width: 600px;
            padding: 2rem;
        }

        .error-code {
            font-size: 120px;
            font-weight: bold;
            line-height: 1;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .error-message {
            font-size: 2rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .error-description {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .error-icon {
            font-size: 80px;
            margin-bottom: 1rem;
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div class="error-page">
        <div class="error-content">
            <div class="error-icon">
                <i class="fas fa-server"></i>
            </div>
            <div class="error-code">500</div>
            <div class="error-message">Server Error</div>
            <div class="error-description">
                We're experiencing technical difficulties. Our team has been notified and is working to fix this.
            </div>
            <div>
                <a href="index.html" class="btn btn-light btn-lg me-2">
                    <i class="fas fa-home me-2"></i>Back to Home
                </a>
                <a href="contact.html" class="btn btn-outline-light btn-lg">
                    <i class="fas fa-envelope me-2"></i>Contact Support
                </a>
            </div>
            <div style="margin-top: 2rem;">
                <p style="font-size: 0.9rem; opacity: 0.8;">
                    Error ID: <code
                        style="background: rgba(0,0,0,0.2); padding: 0.25rem 0.5rem; border-radius: 3px;">500_ERROR</code>
                </p>
                <p style="font-size: 0.9rem; opacity: 0.8;">
                    Please try again in a few moments, or contact us if the problem persists.
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
